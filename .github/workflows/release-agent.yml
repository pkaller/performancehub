name: Build & release agent binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Build each binary on its OWN native runner. pkg cannot reliably
  # cross-compile macOS/Windows binaries from a Linux host, so we build
  # macOS on macOS, Windows on Windows, Linux on Linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node22.23.1-linux-x64
            out: performancehub-agent-linux-x64
          - os: macos-13 # Intel
            target: node22.23.1-macos-x64
            out: performancehub-agent-macos-x64
          - os: macos-14 # Apple Silicon
            target: node22.23.1-macos-arm64
            out: performancehub-agent-macos-arm64
          - os: windows-latest
            target: node22.23.1-win-x64
            out: performancehub-agent-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install agent dependencies
        working-directory: agent
        run: npm install

      - name: Build binary with pkg
        working-directory: agent
        run: npx @yao-pkg/pkg . --targets ${{ matrix.target }} --output dist/${{ matrix.out }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: agent/dist/${{ matrix.out }}
          if-no-files-found: error

  # Collect all binaries and publish a single release with them attached.
  # Runs even if some platform legs failed, so a hiccup on one OS never
  # blocks publishing the binaries that did build.
  release:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: ls -la dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-dev' }}
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
