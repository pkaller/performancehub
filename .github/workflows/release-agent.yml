name: Build & release agent binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install agent dependencies
        working-directory: agent
        run: npm install

      - name: Build binaries with pkg
        working-directory: agent
        run: npx @yao-pkg/pkg . --out-path dist

      # pkg names outputs by the target axes that differ (platform + arch here):
      #   performancehub-agent-linux-x64, -macos-x64, -macos-arm64, -win-x64.exe
      # These match the asset names the website's download page links to.
      - name: List built binaries
        working-directory: agent/dist
        run: ls -la

      - name: Create / update release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-dev' }}
          files: agent/dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
