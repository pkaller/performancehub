<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PerformanceHub · Network Devices</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">📡 PerformanceHub</div>
      <div class="topbar-right">
        <span id="scan-meta" class="scan-meta"></span>
        <button id="scan-btn" class="btn btn-primary">Scan network</button>
        <div class="user" id="user"></div>
        <button id="logout" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <div id="progress" class="progress" hidden>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-text" class="progress-text"></span>
    </div>

    <main class="content">
      <div id="empty" class="empty">
        <h2>No scan yet</h2>
        <p>Click <strong>Scan network</strong> to discover the devices on your LAN.</p>
      </div>
      <div id="devices" class="device-grid"></div>
    </main>

    <!-- Camera modal -->
    <div id="camera-modal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="camera-title">Video feed</h3>
          <button class="btn btn-ghost" data-close-modal>✕</button>
        </div>
        <p class="modal-hint">
          Most IP cameras need credentials and a stream path. Enter them, then Connect.
          Snapshots require <code>ffmpeg</code> installed on the server.
        </p>
        <div class="form-row">
          <label>Username <input id="cam-user" placeholder="admin" /></label>
          <label>Password <input id="cam-pass" type="password" /></label>
        </div>
        <div class="form-row">
          <label class="grow">Stream path
            <input id="cam-path" placeholder="/Streaming/Channels/101" />
          </label>
          <label>Port <input id="cam-port" value="554" /></label>
        </div>
        <div class="cam-view">
          <img id="cam-img" alt="camera snapshot" />
          <div id="cam-status" class="cam-status">Not connected</div>
        </div>
        <div class="modal-foot">
          <label class="live-toggle"><input type="checkbox" id="cam-live" /> Auto-refresh (live)</label>
          <button id="cam-connect" class="btn btn-primary">Connect</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/js/app.js"></script>
  </body>
</html>
